name: BPU fixed-baseline fork checks

on:
  push:
    branches: [bpu-context-flush-dd9592-ci]
  workflow_dispatch:

permissions:
  contents: read

env:
  BPU_BASE_SHA: dd9592f9d76cccd3f6abe56f1874073a60ec6d48

jobs:
  style:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pre-commit==3.8.0
      - name: Verify baseline and run official style checks
        run: python .github/scripts/bpu-fork-style.py

  build-and-test:
    needs: style
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build and raw-image dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential m4 scons zlib1g-dev \
            libprotobuf-dev protobuf-compiler libprotoc-dev \
            libgoogle-perftools-dev python3-dev libboost-all-dev pkg-config \
            libsqlite3-dev zstd libzstd-dev gcc-riscv64-linux-gnu \
            binutils-riscv64-linux-gnu
      - name: Record the exact tested revision
        run: |
          mkdir -p m5out/fork-ci
          git merge-base --is-ancestor "$BPU_BASE_SHA" HEAD
          test "$(git merge-base "$BPU_BASE_SHA" HEAD)" = "$BPU_BASE_SHA"
          git rev-parse HEAD > m5out/fork-ci/tested-sha.txt
          git rev-parse "$BPU_BASE_SHA" > m5out/fork-ci/baseline-sha.txt
      - name: Run the official unit-test target
        run: |
          set -o pipefail
          CC=gcc CXX=g++ scons build/RISCV/unittests.opt -j4 --unit-test --ignore-style 2>&1 | tee m5out/fork-ci/unittests.log
      - name: Build GCC opt
        run: |
          set -o pipefail
          CC=gcc CXX=g++ scons build/RISCV/gem5.opt --linker=gold -j4 --ignore-style 2>&1 | tee m5out/fork-ci/build-opt.log
      - name: Run raw fence regressions without Difftest
        run: |
          make -C util/bpu_flush all wrong-path
          python3 .github/scripts/bpu-fork-smoke.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bpu-fixed-baseline-${{ github.sha }}
          path: |
            m5out/fork-ci/
            build/RISCV/unittests.opt/**/*.xml
          retention-days: 14
